name: Documentation

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          pip install -r docs/requirements.txt
      - name: Build API reference
        run: |
          doxygen --version
          doxygen Doxyfile
          # Doxygen >= 1.14 renamed modules.html to topics.html; keep the old URL working.
          if [ ! -f docs/doxygen/modules.html ] && [ -f docs/doxygen/topics.html ]; then
            cp docs/doxygen/topics.html docs/doxygen/modules.html
          fi
      - name: Build site
        run: zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
