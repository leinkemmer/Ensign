name: Build and Test (Multi-Platform)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} + ${{ matrix.fc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux (Ubuntu) ---
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
            fc: gfortran

          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            fc: gfortran

          # --- macOS ---
          - os: macos-latest
            cc: gcc
            cxx: g++
            fc: gfortran

          - os: macos-latest
            cc: clang
            cxx: clang++
            fc: gfortran

          # --- Windows ---
          # MSVC + GFortran (unsupported combo in many mixed C/Fortran builds, may fail)
          - os: windows-latest
            cc: cl
            cxx: cl
            fc: gfortran

          # MinGW (gcc + gfortran) — build in MSYS2 shell
          - os: windows-latest
            cc: gcc
            cxx: g++
            fc: gfortran
            use_msys2: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # --- Linux/macOS Fortran setup ---
      - name: Set up Fortran (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if ! command -v gfortran &> /dev/null; then
            if [ "${{ runner.os }}" = "Linux" ]; then
              sudo apt-get update
              sudo apt-get install -y gfortran
            elif [ "${{ runner.os }}" = "macOS" ]; then
              brew install gcc
            fi
          fi

      # --- Windows: MSYS2 environment for MinGW builds ---
      - name: Set up MSYS2 (Windows + GCC)
        if: runner.os == 'Windows' && matrix.use_msys2 == true
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Build and test (MSYS2)
        if: runner.os == 'Windows' && matrix.use_msys2 == true
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      # --- Regular builds (Linux, macOS, Windows+MSVC) ---
      - name: Configure environment variables
        if: runner.os != 'Windows' || matrix.use_msys2 != true
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          echo "FC=${{ matrix.fc }}" >> $GITHUB_ENV

      - name: Configure (CMake)
        if: runner.os != 'Windows' || matrix.use_msys2 != true
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.fc }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Windows' || matrix.use_msys2 != true
        run: cmake --build build --parallel

      - name: Run tests
        if: runner.os != 'Windows' || matrix.use_msys2 != true
        run: ctest --test-dir build --output-on-failure
