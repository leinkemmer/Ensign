name: CMake Build

on:
  push:
  pull_request:
  jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            fortran_compiler: gfortran
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            fortran_compiler: gfortran
        fail-fast: false
        
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake fftw gcc

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake fftw3-dev gfortran build-essential
          - name: Configure
        run: cmake -S . -B build \
             -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
             -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
             -DCMAKE_Fortran_COMPILER=${{ matrix.fortran_compiler }} \
             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --output-on-failure -C Release -S build
          
