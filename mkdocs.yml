site_name: Ensign
site_description: A C++ framework for dynamical low-rank algorithms on CPUs and GPUs
site_url: https://leinkemmer.github.io/Ensign/
repo_url: https://github.com/leinkemmer/Ensign
repo_name: leinkemmer/Ensign
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Examples: examples.md
  - API reference: api.md
  - References: references.md

extra:
  generator: false
